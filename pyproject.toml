[project]
name = "mat-tt-case-study"
version = "0.1.0"
description = "TT compression of attention in a Molecular Transformer (MAT) -- case study"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "rdkit>=2026.3.6",
    "scikit-learn>=1.9.1",
    "tensorly>=0.9.0",
    "tensorly-torch>=0.5.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mat_tt"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party code (see src/mat_tt/vendor/mat/NOTICE.md) is kept close to
# upstream rather than reformatted to our style.
extend-exclude = ["src/mat_tt/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "ruff>=0.16.7",
]
